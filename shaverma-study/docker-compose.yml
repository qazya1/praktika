services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: shaverma_study
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: mysql+pymysql://app:app@mysql:3306/shaverma_study
      MANAGER_URL: http://manager:8100
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  manager:
    build: ./manager
    env_file: .env
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8100:8100"
    depends_on:
      - backend

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql_data:
